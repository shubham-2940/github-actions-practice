name: Call Build

on:
    push:
        branches: main

jobs:   
    build:
      uses: ./.github/workflows/reusable-build.yml
      with:
        app_name: "my-web-app"
        environment: "production"
      secrets:
        docker_token: ${{ secrets.DOCKER_TOKEN }}

    version:
        runs-on: ubuntu-latest
        needs: build

        steps:
            - name: Display version
              run: |
                echo "The output was: ${{ needs.build.outputs.my_workflow_output }}"
    
        