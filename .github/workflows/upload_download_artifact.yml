name: Upload and Download artifact

on: workflow_dispatch

jobs:
    Upload:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout the code
              uses: actions/checkout@v4
            
            - name: Create a file
              run: | 
                echo "Report file" > report.txt
                echo "Build report" >> report.txt

            - name: Upload file artifact
              uses: actions/upload-artifact@v4
              with:
                name: shared-file.txt
                path: report.txt
        
    Download:
        runs-on: ubuntu-latest
        needs: [Upload]

        steps:
            - name: Download file artifact
              uses: actions/download-artifact@v4
              with:
                name: shared-file.txt
            
            - name: Read a file
              run: cat report.txt
                