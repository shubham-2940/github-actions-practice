name: self_hosted

on: workflow_dispatch

jobs:
    test:
        runs-on: self-hosted

        steps:
            - name: Display hostname of the machine
              run: hostname

            - name: Working directory
              run: echo "Working directory is:" pwd

            - name: Create a file  
              run: touch test.txt
              
            - name: Vefify file exits
              run: ls -l