name: matrix

on: workflow_dispatch

jobs:
  matrix:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
        
        exclude: 
         - python-version: "3.10"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Display Python Version
        run: python --version
        
